services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportflow}
      POSTGRES_USER: ${POSTGRES_USER:-supportflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 96m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    entrypoint: ["/usr/local/bin/supportflow-migrate"]
    environment:
      SUPPORTFLOW_ENV: ${SUPPORTFLOW_ENV:-lite}
      SUPPORTFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-supportflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supportflow}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SUPPORTFLOW_ENV: ${SUPPORTFLOW_ENV:-lite}
      SUPPORTFLOW_HTTP_ADDR: :8080
      SUPPORTFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-supportflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supportflow}?sslmode=disable
      SUPPORTFLOW_MAX_BODY_BYTES: ${SUPPORTFLOW_MAX_BODY_BYTES:-1048576}
      SUPPORTFLOW_REQUEST_TIMEOUT: ${SUPPORTFLOW_REQUEST_TIMEOUT:-15s}
      SUPPORTFLOW_MODEL_MODE: ${SUPPORTFLOW_MODEL_MODE:-mock}
      SUPPORTFLOW_ALLOWED_ORIGIN: ${SUPPORTFLOW_ALLOWED_ORIGIN:-}
      SUPPORTFLOW_SESSION_TTL: ${SUPPORTFLOW_SESSION_TTL:-30m}
      SUPPORTFLOW_COOKIE_SECURE: ${SUPPORTFLOW_COOKIE_SECURE:-false}
    volumes:
      - object_data:/var/lib/supportflow/storage
    ports:
      - "127.0.0.1:${SUPPORTFLOW_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  object_data:
