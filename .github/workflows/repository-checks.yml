name: 仓库检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查必要文件
        shell: bash
        run: |
          set -euo pipefail
          required=(
            LICENSE
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            docs/PRD.md
            docs/Architecture.md
            docs/Database.md
            docs/API.md
            docs/Development.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "缺少必要文件: $path"; exit 1; }
          done

      - name: 拒绝密钥和运行时数据
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|data/|storage/|backups/)|\.(pem|key)$'; then
            echo "仓库中包含密钥或运行时数据路径。"
            exit 1
          fi
