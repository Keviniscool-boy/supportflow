name: 仓库检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查必要文件
        shell: bash
        run: |
          set -euo pipefail
          required=(
            LICENSE
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            docs/PRD.md
            docs/Architecture.md
            docs/Database.md
            docs/API.md
            docs/Development.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "缺少必要文件: $path"; exit 1; }
          done

      - name: 拒绝密钥和运行时数据
        shell: bash
        run: |
          set -euo pipefail
          sensitive_paths="$(git ls-files | grep -E '(^|/)(\.env($|\.)|data/|storage/|backups/)|\.(pem|key)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$sensitive_paths" ]]; then
            echo "$sensitive_paths"
            echo "仓库中包含密钥或运行时数据路径。"
            exit 1
          fi

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 检查并测试后端
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
