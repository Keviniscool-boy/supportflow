name: Bug 报告
description: 报告可复现且与文档预期不一致的问题。
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 SupportFlow。请勿在此提供凭据、Customer 数据或漏洞利用细节。
  - type: checkboxes
    attributes:
      label: 提交之前
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 这不是安全漏洞；安全问题应私下报告。
          required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 描述实际发生的行为和你的预期结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 提供能够稳定复现问题的最小步骤。
    validations:
      required: true
  - type: input
    attributes:
      label: 版本或 Commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: 运行环境
      description: 请按需提供操作系统、浏览器、部署模式和模型模式。
  - type: textarea
    attributes:
      label: 补充信息
      description: 可提供已脱敏日志、截图或 Trace Reason Code。
