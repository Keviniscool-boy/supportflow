name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SupportFlow. Do not include credentials, customer data, or vulnerability details here.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include OS, browser, deployment profile, and model mode when relevant.
  - type: textarea
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, or Trace reason codes when useful.
